<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>❤️ Khánh Lyy ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at center,
            #35001f 0%,
            #15000d 45%,
            #050005 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
}

/* =========================
   CANVAS
========================= */

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================
   KHỐI CHỮ
========================= */

.title {
    position: relative;
    z-index: 10;

    width: 88%;
    max-width: 390px;

    text-align: center;

    color: white;

    font-size: clamp(16px, 4.3vw, 22px);
    line-height: 1.45;

    font-weight: bold;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    letter-spacing: 0.5px;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ff4fa3,
        0 0 25px #ff1688;

    animation: textGlow 2s ease-in-out infinite alternate;

    pointer-events: none;
}

/* Tên */
.title .name {
    display: block;

    margin-bottom: 12px;

    font-size: clamp(30px, 9vw, 48px);

    color: #fff;

    text-shadow:
        0 0 8px #fff,
        0 0 18px #ff65b5,
        0 0 35px #ff1688;
}

/* Từng câu */
.title .message {
    display: block;

    margin: 7px 0;

    font-family: Arial, sans-serif;

    font-size: clamp(14px, 3.8vw, 18px);

    font-weight: 500;

    line-height: 1.5;
}

/* =========================
   HIỆU ỨNG CHỮ
========================= */

@keyframes textGlow {

    from {
        transform: scale(1);
        filter: brightness(1);
    }

    to {
        transform: scale(1.025);
        filter: brightness(1.18);
    }
}
</style>
</head>

<body>

<canvas id="heartCanvas"></canvas>

<div class="title">

    <span class="name">
        ❤️ Khánh Lyy ❤️
    </span>

    <span class="message">
        Khánh Ly giống như một tia nắng nhỏ,
        cứ xuất hiện là làm ngày của tớ
        tự nhiên vui hơn. ☀️
    </span>

    <span class="message">
        Nếu niềm vui có tên,
        chắc tớ sẽ gọi nó là
        “Khánh Ly”. 🌷
    </span>

    <span class="message">
        Không biết Khánh Ly có phép thuật gì không,
        mà mỗi lần nói chuyện với cậu
        là tớ lại thấy vui vui. 🫶
    </span>

</div>

<script>

const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

let hearts = [];
let particles = [];

let W = window.innerWidth;
let H = window.innerHeight;

let dpr = Math.min(window.devicePixelRatio || 1, 2);

/* =========================
   RESIZE
========================= */

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    createHearts();
    createParticles();
}

/* =========================
   PHƯƠNG TRÌNH TRÁI TIM
========================= */

function heartFunction(t) {

    return {
        x: 16 * Math.pow(Math.sin(t), 3),

        y:
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t)
    };
}

/* =========================
   TẠO TRÁI TIM NHỎ
========================= */

function createHearts() {

    hearts = [];

    /*
       Điều chỉnh kích thước trái tim
       tự động theo màn hình.
    */

    const mobile = W < 600;

    const scale =
        Math.min(W, H)
        / (mobile ? 35 : 32);

    /*
       Mobile ít hạt hơn để
       iPhone chạy mượt.
    */

    const amount = mobile ? 5000 : 8000;

    for (let i = 0; i < amount; i++) {

        const x =
            Math.random() * 32 - 16;

        const y =
            Math.random() * 30 - 15;

        const yy = -y;

        const equation =
            Math.pow(
                x * x + yy * yy - 1,
                3
            )
            -
            x * x *
            Math.pow(yy, 3);

        if (equation <= 0) {

            /*
               Chừa khoảng trống
               ở giữa để chữ nổi bật.
            */

            const distance =
                Math.sqrt(
                    x * x +
                    y * y
                );

            if (distance < 4.8) {
                continue;
            }

            /*
               Hiệu ứng xếp so le.
            */

            const stagger =
                Math.random() > 0.5
                    ? 0.22
                    : -0.22;

            hearts.push({

                baseX:
                    W / 2 +
                    x * scale +
                    stagger * scale,

                baseY:
                    H / 2 +
                    y * scale,

                x:
                    W / 2 +
                    x * scale,

                y:
                    H / 2 +
                    y * scale,

                size:
                    Math.random() * 3.2 + 3.8,

                rotation:
                    Math.random() *
                    Math.PI * 2,

                speed:
                    Math.random() *
                    0.02 + 0.005,

                phase:
                    Math.random() *
                    Math.PI * 2,

                hue:
                    Math.random() *
                    25 + 325
            });
        }
    }
}

/* =========================
   VẼ TRÁI TIM
========================= */

function drawHeart(
    x,
    y,
    size,
    rotation,
    color,
    glow
) {

    ctx.save();

    ctx.translate(x, y);

    ctx.rotate(rotation);

    ctx.beginPath();

    ctx.moveTo(
        0,
        size * 0.35
    );

    ctx.bezierCurveTo(
        -size * 1.2,
        -size * 0.35,

        -size * 0.65,
        -size * 1.1,

        0,
        -size * 0.45
    );

    ctx.bezierCurveTo(
        size * 0.65,
        -size * 1.1,

        size * 1.2,
        -size * 0.35,

        0,
        size * 0.35
    );

    ctx.shadowBlur = glow;

    ctx.shadowColor = color;

    const gradient =
        ctx.createLinearGradient(
            -size,
            -size,
            size,
            size
        );

    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        0.25,
        color
    );

    gradient.addColorStop(
        1,
        "#c90065"
    );

    ctx.fillStyle = gradient;

    ctx.fill();

    ctx.restore();
}

/* =========================
   HẠT SÁNG
========================= */

function createParticles() {

    particles = [];

    const amount =
        W < 600 ? 70 : 120;

    for (let i = 0; i < amount; i++) {

        particles.push({

            x:
                Math.random() * W,

            y:
                Math.random() * H,

            size:
                Math.random() * 2 + 0.5,

            speed:
                Math.random() *
                0.5 + 0.15,

            phase:
                Math.random() *
                Math.PI * 2
        });
    }
}

/* =========================
   ANIMATION
========================= */

function animate(time) {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    /* =====================
       HẠT SÁNG BAY
    ===================== */

    particles.forEach(p => {

        p.phase += 0.02;

        p.y -= p.speed;

        if (p.y < -10) {
            p.y = H + 10;
        }

        const alpha =
            0.2 +
            Math.sin(p.phase) *
            0.35;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,120,200,${alpha})`;

        ctx.shadowBlur = 12;

        ctx.shadowColor =
            "#ff2f9d";

        ctx.fill();
    });

    /* =====================
       TRÁI TIM NHỎ
    ===================== */

    hearts.forEach(h => {

        /*
           Chuyển động lơ lửng
        */

        const floating =
            Math.sin(
                time * 0.0015 +
                h.phase
            ) * 2;

        /*
           Hiệu ứng đập
        */

        const pulse =
            1 +
            Math.sin(
                time * 0.002 +
                h.phase
            ) * 0.12;

        /*
           Chuyển động nhẹ sang trái/phải
        */

        const wave =
            Math.sin(
                time * 0.0008 +
                h.phase
            ) * 2;

        drawHeart(

            h.baseX + wave,

            h.baseY + floating,

            h.size * pulse,

            h.rotation,

            `hsl(${h.hue}, 100%, 65%)`,

            10
        );
    });

    requestAnimationFrame(animate);
}

/* =========================
   KHỞI ĐỘNG
========================= */

window.addEventListener(
    "resize",
    resize
);

resize();

requestAnimationFrame(animate);

</script>

</body>
</html>
```
